basePath: /
definitions:
  dto.ArticleResponse:
    properties:
      author_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      slug:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.ArticleRevisionResponse:
    properties:
      article_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      editor_id:
        type: integer
      id:
        type: integer
      slug:
        type: string
      title:
        type: string
    type: object
  dto.CreateArticleRequest:
    properties:
      content:
        type: string
      slug:
        maxLength: 255
        minLength: 3
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - content
    - slug
    - title
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  dto.ErrorResponse:
    description: Стандартный ответ при ошибке
    properties:
      error:
        example: Описание ошибки
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.UpdateArticleRequest:
    properties:
      content:
        type: string
      slug:
        maxLength: 255
        minLength: 3
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - content
    - slug
    - title
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API для корпоративной Wiki (Auth, Users)
  title: Corporate Wiki API
  version: "1.0"
paths:
  /api/articles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ArticleResponse'
            type: array
        "401":
          description: Невалидный или отсутствующий токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список статей
      tags:
      - articles
    post:
      consumes:
      - application/json
      description: Создаёт новую статью в статусе draft; дубликат slug даёт 409. Первая
        ревизия истории создаётся автоматически
      parameters:
      - description: Данные статьи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateArticleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ArticleResponse'
        "400":
          description: Некорректные данные
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Невалидный или отсутствующий токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Статья с таким slug уже существует
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать статью
      tags:
      - articles
  /api/articles/{id}:
    delete:
      description: 'Soft-delete: автор или admin. Возвращает пустое тело'
      parameters:
      - description: ID статьи
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Статья удалена
        "400":
          description: Некорректный ID статьи
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Невалидный или отсутствующий токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Нет прав на удаление этой статьи
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Статья не найдена
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить статью
      tags:
      - articles
    get:
      parameters:
      - description: ID статьи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArticleResponse'
        "400":
          description: Некорректный ID статьи
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Невалидный или отсутствующий токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Статья не найдена
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить статью по ID
      tags:
      - articles
    put:
      consumes:
      - application/json
      description: Автор может менять свою статью, editor/admin — любую. После успешного
        изменения создаётся ревизия с новым содержимым
      parameters:
      - description: ID статьи
        in: path
        name: id
        required: true
        type: integer
      - description: Новые данные статьи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateArticleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArticleResponse'
        "400":
          description: Некорректные данные или ID
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Невалидный или отсутствующий токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Нет прав на изменение этой статьи
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Статья не найдена
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Статья с таким slug уже существует
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить статью
      tags:
      - articles
  /api/articles/{id}/approve:
    post:
      description: 'Editor/admin: pending -> published. Других переходов Service не
        допускает'
      parameters:
      - description: ID статьи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArticleResponse'
        "400":
          description: Некорректный ID статьи
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Невалидный или отсутствующий токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Только editor/admin
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Статья не найдена
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Статья не в статусе pending
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Одобрить статью
      tags:
      - articles
  /api/articles/{id}/reject:
    post:
      description: 'Editor/admin: pending -> rejected. Причина отклонения — позже
        с AuditLog'
      parameters:
      - description: ID статьи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArticleResponse'
        "400":
          description: Некорректный ID статьи
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Невалидный или отсутствующий токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Только editor/admin
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Статья не найдена
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Статья не в статусе pending
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отклонить статью
      tags:
      - articles
  /api/articles/{id}/revisions:
    get:
      description: Ревизии содержимого, свежие первыми. Доступна всем авторизованным
        до появления ArticlePermission
      parameters:
      - description: ID статьи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ArticleRevisionResponse'
            type: array
        "400":
          description: Некорректный ID статьи
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Невалидный или отсутствующий токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Статья не найдена
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: История изменений статьи
      tags:
      - articles
  /api/articles/{id}/submit:
    post:
      description: 'Только автор и только из статуса draft: draft -> pending'
      parameters:
      - description: ID статьи
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ArticleResponse'
        "400":
          description: Некорректный ID статьи
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Невалидный или отсутствующий токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Отправить на модерацию может только автор
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Статья или пользователь не найдены
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Статья не в статусе draft
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Отправить статью на модерацию
      tags:
      - articles
  /api/profile:
    get:
      consumes:
      - application/json
      description: Возвращает данные текущего пользователя по JWT-токену в заголовке
        Authorization
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Невалидный или отсутствующий токен
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Профиль пользователя
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет логин и пароль, возвращает JWT-токен и данные пользователя
      parameters:
      - description: Учётные данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Некорректный запрос (невалидный JSON)
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Неверный email или пароль
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Вход в систему
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя через публичный эндпоинт регистрации
      parameters:
      - description: Данные регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Некорректный запрос (невалидный JSON)
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Пользователь с таким email уже существует
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Регистрация
      tags:
      - auth
  /health:
    get:
      consumes:
      - application/json
      description: Возвращает статус приложения (alive, starting и т.д.)
      produces:
      - application/json
      responses:
        "200":
          description: Статус приложения
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверка состояния
      tags:
      - health
  /users:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя в системе (административный эндпоинт)
      parameters:
      - description: Данные пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Некорректный запрос (невалидный JSON)
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Пользователь с таким email уже существует
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Создать пользователя
      tags:
      - users
  /users/:id:
    get:
      consumes:
      - application/json
      description: Возвращает данные пользователя по его числовому идентификатору
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Некорректный ID пользователя
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Пользователь с таким ID не найден
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Получить пользователя по ID
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
